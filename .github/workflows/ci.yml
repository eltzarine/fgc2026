name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data.json"]
  pull_request:
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Actions figées par SHA de commit (v4.2.2 et v4.4.0)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Vérifications statiques (CSP, précache, manifeste, syntaxe)
        run: node tools/check-static.mjs
      - name: Tests unitaires
        run: node --test tests/unit/data.test.js tests/unit/scrape.test.js
      - name: Vérification de types
        run: npx --yes -p typescript@6.0.3 tsc -p jsconfig.json

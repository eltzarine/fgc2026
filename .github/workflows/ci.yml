name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data.json"]
  pull_request:
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Actions figées par SHA de commit (v4.2.2 et v4.4.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Vérifications statiques (CSP, précache, manifeste, syntaxe)
        run: node tools/check-static.mjs
      - name: Tests unitaires
        run: node --test tests/unit/data.test.js tests/unit/scrape.test.js
      - name: Vérification de types
        run: npx --yes typescript@5.6.3 tsc -p jsconfig.json
